<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Álbum</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{base :: nav}"></div>
    <main class="container py-4">
      <a href="/albums" class="btn btn-link px-0">← Mis álbumes</a>
      <div
        th:if="${mensaje}"
        class="alert alert-success"
        th:text="${mensaje}"
      ></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h1 class="h3" th:text="${album.nombre}"></h1>
          <p class="text-muted" th:text="${album.descripcion}"></p>
        </div>
        <div>
          <a
            class="btn btn-primary"
            th:href="@{/albums/{id}/photos/new(id=${album.id})}"
            >Subir fotos</a
          >
          <form
            th:action="@{/albums/{id}/delete(id=${album.id})}"
            method="post"
            class="d-inline"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />
            <button class="btn btn-outline-danger">Eliminar álbum</button>
          </form>
        </div>
      </div>
      <form
        th:action="@{/albums/{id}/photos/delete(id=${album.id})}"
        method="post"
      >
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />
        <div th:if="${fotos.isEmpty()}" class="card mt-3">
          <div class="card-body text-muted">
            Este álbum todavía no tiene fotos.
          </div>
        </div>
        <div class="row g-3 mt-1">
          <div class="col-sm-6 col-lg-4" th:each="foto : ${fotos}">
            <div class="card">
              <a
                th:href="@{/albums/{id}/photos/{fotoId}(id=${album.id},fotoId=${foto.id})}"
                ><img
                  class="card-img-top"
                  style="height: 200px; object-fit: cover"
                  th:src="@{/albums/{id}/photos/{fotoId}/content(id=${album.id},fotoId=${foto.id})}"
              /></a>
              <div class="card-body">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    name="idsFotos"
                    th:value="${foto.id}"
                    th:id="|foto-${foto.id}|"
                  /><label class="form-check-label" th:for="|foto-${foto.id}|"
                    >Seleccionar</label
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
        <button
          th:unless="${fotos.isEmpty()}"
          class="btn btn-outline-danger mt-3"
        >
          Eliminar seleccionadas
        </button>
      </form>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>UMBook - Amigos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">UMBook</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/friends">Amigos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/groups">Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/albums">Álbumes</a></li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-link nav-link">Cerrar Sesión</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <h2>Mis Amigos</h2>
        <hr>
        <div class="row">
            <div class="col-md-12">
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="amigo : ${amigos}">
                        <span th:text="${amigo.amigoUsuario.nombre + ' ' + amigo.amigoUsuario.apellido}">Amigo</span>
                        <button class="btn btn-danger btn-sm">Eliminar</button>
                    </li>
                    <li class="list-group-item text-muted" th:if="${amigos == null or amigos.isEmpty()}">No tienes amigos agregados aún.</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>

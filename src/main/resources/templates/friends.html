<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>UMBook - Amigos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{base :: nav}"></div>
    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Mis Amigos</h2>
        <div>
          <a href="/friends/search" class="btn btn-primary">Buscar Amigos</a>
          <a href="/friends/requests" class="btn btn-secondary">Solicitudes</a>
        </div>
      </div>
      <hr />
      <div class="row">
        <div class="col-md-12">
          <ul class="list-group">
            <li
              class="list-group-item d-flex justify-content-between align-items-center"
              th:each="amigo : ${amigos}"
            >
              <span
                th:text="${amigo.amigoUsuario.nombre + ' ' + amigo.amigoUsuario.apellido}"
                >Amigo</span
              >
              <form th:action="@{'/friends/remove/' + ${amigo.amigoUsuario.id}}" method="post">
                <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
              </form>
            </li>
            <li
              class="list-group-item text-muted"
              th:if="${amigos == null or amigos.isEmpty()}"
            >
              No tienes amigos agregados aún.
            </li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>

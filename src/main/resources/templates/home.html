<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>UMBook - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{base :: nav}"></div>
    <!-- Simple navigation included directly for the PoC without complex layout dialect -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">UMBook</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/friends">Amigos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/groups">Grupos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/albums">Álbumes</a></li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-link nav-link">Cerrar Sesión</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Bienvenido a UMBook, <span th:text="${usuario.nombre}">Usuario</span>!</h1>
        <hr>
        <div class="row">
            <div class="col-md-8">
                <h3>Muro</h3>
                <div class="card mb-3">
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <textarea class="form-control" placeholder="Escribe algo en tu muro..."></textarea>
                            </div>
                            <button class="btn btn-primary">Publicar</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <h3>Cumpleaños Próximos</h3>
                <div class="alert alert-info">
                    Ninguno de tus amigos cumple años en los próximos días.
                </div>
                <h3>Notificaciones</h3>
                <ul class="list-group">
                    <li class="list-group-item text-muted">No tienes notificaciones.</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>

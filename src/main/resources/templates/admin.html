<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>UMBook - Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
<body>
<div th:replace="~{base :: nav}"></div>
<div class="container mt-4">
    <h2>Panel de Administración</h2>
    
    <div th:if="${param.updated}" class="alert alert-success">Estado de usuario actualizado correctamente.</div>
    <div th:if="${param.comment_deleted}" class="alert alert-success">Comentario moderado correctamente.</div>
    
    <hr>
    <h4>Buscar Usuarios</h4>
    <form action="/admin" method="get" class="d-flex mb-4">
        <input class="form-control me-2" type="search" name="query" placeholder="Buscar por nombre o apellido..." aria-label="Search">
        <button class="btn btn-outline-primary" type="submit">Buscar</button>
    </form>
    
    <table class="table table-striped" th:if="${usuarios != null}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Nombre</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${usuarios}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.nombre + ' ' + user.apellido}"></td>
                <td th:text="${user.estado}"></td>
                <td>
                    <form th:action="@{/admin/usuarios/{id}/toggle(id=${user.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-warning" th:text="${user.estado.name() == 'ACTIVO' ? 'Deshabilitar' : 'Habilitar'}"></button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    
    <hr>
    <h4>Moderación Rápida de Comentarios</h4>
    <form th:action="@{/admin/comentarios/eliminar}" method="post" class="d-flex w-50">
        <input class="form-control me-2" type="number" name="commentId" placeholder="ID del Comentario a Eliminar" required>
        <button class="btn btn-danger" type="submit">Eliminar Comentario</button>
    </form>
</div>
</body>
</html>

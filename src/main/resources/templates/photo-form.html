<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Subir fotos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{base :: nav}"></div>
    <main class="container py-4" style="max-width: 720px">
      <h1 class="h3" th:text="|Subir fotos a ${album.nombre}|"></h1>
      <form
        th:action="@{/albums/{id}/photos(id=${album.id})}"
        th:object="${fotosForm}"
        method="post"
        enctype="multipart/form-data"
        class="card card-body mt-3"
      >
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />
        <div
          th:if="${#fields.hasGlobalErrors()}"
          class="alert alert-danger"
          th:each="e : ${#fields.globalErrors()}"
          th:text="${e}"
        ></div>
        <label class="form-label">Fotos JPEG</label
        ><input
          class="form-control"
          type="file"
          name="fotos"
          accept="image/jpeg"
          multiple
          required
          data-photo-input
        />
        <div class="mt-3" data-comment-container></div>
        <p class="form-text">Seleccioná una o más fotos.</p>
        <div class="d-flex gap-2">
          <button class="btn btn-primary">Subir</button
          ><a
            class="btn btn-outline-secondary"
            th:href="@{/albums/{id}(id=${album.id})}"
            >Cancelar</a
          >
        </div>
      </form>
    </main>
    <script src="/js/photo-comments.js"></script>
  </body>
</html>

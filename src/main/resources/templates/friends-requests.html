<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Solicitudes de Amistad</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{base :: nav}"></div>
    <div class="container mt-4">
        <h2>Solicitudes Recibidas</h2>
        <div th:if="${solicitudes != null}">
            <ul class="list-group">
                <li th:each="solicitud : ${solicitudes}" class="list-group-item d-flex justify-content-between align-items-center">
                    <span th:text="${solicitud.solicitante.nombre} + ' ' + ${solicitud.solicitante.apellido}"></span>
                    <div>
                        <form th:action="@{'/friends/requests/' + ${solicitud.id} + '/accept'}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-success">Aceptar</button>
                        </form>
                        <form th:action="@{'/friends/requests/' + ${solicitud.id} + '/reject'}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger">Rechazar</button>
                        </form>
                    </div>
                </li>
                <li th:if="${solicitudes.isEmpty()}" class="list-group-item">No tienes solicitudes pendientes.</li>
            </ul>
        </div>
    </div>
</body>
</html>

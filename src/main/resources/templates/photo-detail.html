<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{base :: nav}"></div>
    <main class="container py-4" style="max-width: 850px">
      <a th:href="@{/albums/{id}(id=${album.id})}" class="btn btn-link px-0"
        >← Volver al álbum</a
      >
      <div
        th:if="${mensaje}"
        class="alert alert-success"
        th:text="${mensaje}"
      ></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <img
        class="img-fluid rounded shadow-sm w-100"
        th:src="@{/albums/{id}/photos/{fotoId}/content(id=${album.id},fotoId=${foto.id})}"
      />
      <section class="card card-body mt-4">
        <h2 class="h5">Comentarios</h2>
        <form
          th:action="@{/albums/{id}/photos/{fotoId}/comments(id=${album.id},fotoId=${foto.id})}"
          th:object="${comentarioForm}"
          method="post"
        >
          <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
          /><textarea
            class="form-control"
            th:field="*{contenido}"
            maxlength="250"
            required
            placeholder="Escribí un comentario"
          ></textarea
          ><button class="btn btn-primary mt-2">Publicar comentario</button>
        </form>
        <div
          class="border-top mt-3 pt-3 position-relative"
          th:each="comentario : ${comentarios}"
        >
          <div class="dropdown position-absolute top-0 end-0">
            <button
              class="btn btn-sm btn-link text-dark"
              type="button"
              data-bs-toggle="dropdown"
              aria-label="Opciones del comentario"
            >
              ⋮
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <button
                  class="dropdown-item"
                  type="button"
                  data-edit-form
                  th:data-edit-form="|editar-${comentario.id}|"
                >
                  Modificar
                </button>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <form
                  th:action="@{/albums/{id}/photos/{fotoId}/comments/{comentarioId}/delete(id=${album.id},fotoId=${foto.id},comentarioId=${comentario.id})}"
                  method="post"
                >
                  <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                  />
                  <button class="dropdown-item text-danger" type="submit">
                    Eliminar
                  </button>
                </form>
              </li>
            </ul>
          </div>
          <p class="mb-2 pe-4">
            <strong th:text="${comentario.autor.username}"></strong>
            <span th:text="${comentario.contenido}"></span>
          </p>
          <form
            class="d-none gap-2"
            th:id="|editar-${comentario.id}|"
            th:action="@{/albums/{id}/photos/{fotoId}/comments/{comentarioId}/edit(id=${album.id},fotoId=${foto.id},comentarioId=${comentario.id})}"
            method="post"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            /><input
              class="form-control"
              name="contenido"
              maxlength="250"
              required
              th:value="${comentario.contenido}"
            /><button class="btn btn-outline-primary">Guardar</button>
          </form>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.querySelectorAll("[data-edit-form]").forEach((button) => {
        button.addEventListener("click", () => {
          document
            .getElementById(button.dataset.editForm)
            .classList.toggle("d-none");
        });
      });
    </script>
  </body>
</html>

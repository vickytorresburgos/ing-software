<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UMBook - Álbumes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{base :: nav}"></div>
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Mis álbumes</h1>
      </div>
      <div
        th:if="${mensaje}"
        class="alert alert-success"
        th:text="${mensaje}"
      ></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <a class="btn btn-success mb-4" href="/albums/new">Crear álbum</a>
      <div th:if="${albumes.isEmpty()}" class="card">
        <div class="card-body text-muted">Aún no creaste álbumes.</div>
      </div>
      <div class="row g-3" th:unless="${albumes.isEmpty()}">
        <div class="col-md-6 col-lg-4" th:each="album : ${albumes}">
          <a
            class="card h-100 text-decoration-none"
            th:href="@{/albums/{id}(id=${album.id})}"
          >
            <div class="card-body">
              <h2 class="h5 text-dark" th:text="${album.nombre}"></h2>
              <p class="text-muted mb-0" th:text="${album.descripcion}"></p>
            </div>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>

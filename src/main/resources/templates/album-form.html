<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear álbum</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{base :: nav}"></div>
    <main class="container py-4" style="max-width: 720px">
      <h1 class="h3">Crear álbum</h1>
      <form
        th:action="@{/albums}"
        th:object="${albumForm}"
        method="post"
        enctype="multipart/form-data"
        class="card card-body mt-3"
      >
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />
        <div
          th:if="${#fields.hasGlobalErrors()}"
          class="alert alert-danger"
          th:each="e : ${#fields.globalErrors()}"
          th:text="${e}"
        ></div>
        <label class="form-label">Nombre</label
        ><input class="form-control" th:field="*{nombre}" maxlength="30" />
        <div class="text-danger small" th:errors="*{nombre}"></div>
        <label class="form-label mt-3">Descripción</label
        ><textarea
          class="form-control"
          th:field="*{descripcion}"
          maxlength="250"
        ></textarea>
        <div class="text-danger small" th:errors="*{descripcion}"></div>
        <div class="mt-3">
          <label class="form-label">Grupos que pueden visualizar</label>
          <div th:each="grupo : ${grupos}" class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              th:field="*{gruposVisualizacionIds}"
              th:value="${grupo.id}"
            /><label class="form-check-label" th:text="${grupo.nombre}"></label>
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label">Grupos que pueden comentar</label>
          <div th:each="grupo : ${grupos}" class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              th:field="*{gruposComentarioIds}"
              th:value="${grupo.id}"
            /><label class="form-check-label" th:text="${grupo.nombre}"></label>
          </div>
        </div>
        <label class="form-label mt-3">Fotos JPEG (opcional)</label>
        <input class="form-control" type="file" name="fotos" accept="image/jpeg" multiple data-photo-input />
        <div class="mt-3" data-comment-container></div>
        <p class="form-text">Podés crear el álbum sin fotos.</p>
        <div class="d-flex gap-2">
          <button class="btn btn-primary">Confirmar</button
          ><a class="btn btn-outline-secondary" href="/albums">Cancelar</a>
        </div>
      </form>
    </main>
    <script src="/js/photo-comments.js"></script>
  </body>
</html>

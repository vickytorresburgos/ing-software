<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{base :: nav}"></div>
    <div class="container mt-4">
        <h2>Buscar Usuarios</h2>
        <form action="/friends/search" method="get" class="mb-4 d-flex">
            <input type="text" name="q" class="form-control me-2" placeholder="Nombre o apellido" th:value="${param.q}" required>
            <button type="submit" class="btn btn-primary">Buscar</button>
        </form>

        <div th:if="${usuarios != null}">
            <h4>Resultados</h4>
            <ul class="list-group">
                <li th:each="u : ${usuarios}" class="list-group-item d-flex justify-content-between align-items-center">
                    <span th:text="${u.nombre} + ' ' + ${u.apellido}"></span>
                    
                    <span th:if="${statusMap[u.id] == 'AMIGO'}" class="badge bg-success">Amigo</span>
                    <span th:if="${statusMap[u.id] == 'PENDIENTE_ENVIADA'}" class="badge bg-secondary">Solicitud Pendiente</span>
                    <span th:if="${statusMap[u.id] == 'PENDIENTE_RECIBIDA'}" class="badge bg-info text-dark">Solicitud Recibida</span>
                    
                    <form th:if="${statusMap[u.id] == 'NADA'}" th:action="@{'/friends/add/' + ${u.id}}" method="post">
                        <button type="submit" class="btn btn-sm btn-success">Enviar Solicitud</button>
                    </form>
                </li>
                <li th:if="${usuarios.isEmpty()}" class="list-group-item">No se encontraron resultados.</li>
            </ul>
        </div>
    </div>
</body>
</html>
